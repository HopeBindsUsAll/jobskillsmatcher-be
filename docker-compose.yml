services:
  postgres:
    image: postgres:16-alpine
    container_name: jsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobskillsmatcher
      POSTGRES_USER: jsm
      POSTGRES_PASSWORD: jsm
    ports:
      - "5433:5432"
    volumes:
      - jsm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsm -d jobskillsmatcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jsm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jsm.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - jsm-pgadmin:/var/lib/pgadmin

volumes:
  jsm-pgdata:
  jsm-pgadmin:
