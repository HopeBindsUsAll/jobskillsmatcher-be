services:
  postgres:
    image: postgres:16-alpine
    container_name: jsm-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jobskillsmatcher}
      POSTGRES_USER: ${DB_USER:-jsm}
      POSTGRES_PASSWORD: ${DB_PASS:-jsm}
    volumes:
      - jsm-pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jsm} -d ${DB_NAME:-jobskillsmatcher}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: jsm-backend:latest
    container_name: jsm-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-jobskillsmatcher}
      DB_USER: ${DB_USER:-jsm}
      DB_PASS: ${DB_PASS:-jsm}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in env (>=32 chars)}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      JOBSKILLSMATCHER_CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: jsm-web:latest
    container_name: jsm-web-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-80}:80"

volumes:
  jsm-pgdata-prod:
